# data/consensus.yaml
#
# Manually maintained bank-consensus commodity forecasts.
#
# LAST REFRESH: 2026-10-16
# Anchored on October-vintage published research — Goldman Sachs
# Commodities Weekly, JPMorgan Global Research, UBS Global Wealth
# Management, TD Securities, EIA September STEO, USDA October WASDE,
# Conab Brazil 26/27 coffee survey, Reuters cocoa poll, Citi EU gas.
#
# Schema:
#   <Commodity Name>:
#     - source: "Goldman Sachs"
#       published: YYYY-MM-DD     # report publication date
#       note: "citation / methodology hint"
#       unit: "$/bbl"              # informational
#       quarters:                  # forward quarterly forecasts
#         Q4_2026: __
#         Q1_2027: __
#         Q2_2027: __
#         Q3_2027: __
#       fy:                        # optional calendar-year forecasts
#         2026: __
#         2027: __
#
# Commodity names MUST match those in commodities_forecast.COMMODITIES.
# ─────────────────────────────────────────────────────────────────────────────

